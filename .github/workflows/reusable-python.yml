name: Reusable Python evidence

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of supported Python versions
        required: false
        type: string
        default: '["3.11", "3.12"]'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Compile tracked Python
        run: python -m compileall -q src tests
      - name: Unit and negative tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel without dependency resolution
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
      - name: Install and inspect wheel in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/artifact-venv"
          "$RUNNER_TEMP/artifact-venv/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/artifact-venv/bin/python" -m pip check

