name: Reusable Python evidence

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of explicitly supported Python versions
        required: false
        type: string
        default: '["3.11", "3.12", "3.13", "3.14"]'
      smoke-command:
        description: Optional product-specific installed-artifact smoke command
        required: false
        type: string
        default: ""

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Compile tracked Python
        run: python -m compileall -q src tests
      - name: Unit and negative tests
        run: python -m unittest discover -s tests -v
      - name: Install audited build frontend
        run: python -m pip install --disable-pip-version-check "build==1.2.2.post1"
      - name: Build sdist and wheel
        run: python -m build --outdir dist
      - name: Install wheel and sdist independently
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/wheel-venv"
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --disable-pip-version-check --no-deps dist/*.whl
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install --disable-pip-version-check --no-deps dist/*.tar.gz
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip check
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip check
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip list --format=json --exclude pip --exclude setuptools --exclude wheel > "$RUNNER_TEMP/wheel-packages.json"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip list --format=json --exclude pip --exclude setuptools --exclude wheel > "$RUNNER_TEMP/sdist-packages.json"
          diff -u "$RUNNER_TEMP/wheel-packages.json" "$RUNNER_TEMP/sdist-packages.json"
      - name: Smoke the installed wheel
        if: inputs.smoke-command != ''
        shell: bash
        env:
          SMOKE_COMMAND: ${{ inputs.smoke-command }}
        run: PATH="$RUNNER_TEMP/wheel-venv/bin:$PATH" bash -euo pipefail -c "$SMOKE_COMMAND"
      - name: Smoke the installed sdist
        if: inputs.smoke-command != ''
        shell: bash
        env:
          SMOKE_COMMAND: ${{ inputs.smoke-command }}
        run: PATH="$RUNNER_TEMP/sdist-venv/bin:$PATH" bash -euo pipefail -c "$SMOKE_COMMAND"
