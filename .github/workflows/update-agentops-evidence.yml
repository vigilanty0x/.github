name: Temporary record AgentOps rehearsal evidence

permissions:
  contents: write

on:
  push:
    branches:
      - audit/portfolio-governance-v1-20260818

concurrency:
  group: portfolio-agentops-evidence
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: audit/portfolio-governance-v1-20260818
      - name: Record current bounded AgentOps evidence without claiming release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          from textwrap import dedent

          root = Path.cwd()
          observed_at = "2026-08-18T02:26:33Z"
          expires_at = "2026-09-17T02:26:33Z"
          pr_url = "https://github.com/vigilanty0x/automation-control-plane/pull/4"
          ci_url = "https://github.com/vigilanty0x/automation-control-plane/actions/runs/32091685544"
          head_sha = "cc89dce628202c0ec590567fc7f41ad9637a8012"
          ci_run = 32091685544

          source_shas = {
              "agentmesh": "320f5116f6582519d1609ce87287fd9ff7267eb3",
              "agent-budgeter": "cfa9c0a8830f3e2e3a11602da590e347f8483d2f",
              "agent-inbox": "748f237659f98a2a49478aa58913e71e59a03433",
              "agent-quota-simulator": "e99000cecf12432365e8ccfc8fa6e4b1d18ad15f",
              "agent-retry-kit": "38f97aaa6796fda6956202aad9086e3e5e8ada9f",
              "agent-session-recorder": "2363c4efe0c61158c523a6dfc3d29cb3d7af1c54",
              "circuit-breaker-lab": "2924dfb6eed8a208788491fa1d50fa6bd99e4359",
              "context-window-budgeter": "35bb3e05d05ad870715b740143c429f08eda25e7",
              "human-in-the-loop-queue": "db281bf7ff971a2fd4ca6af9e495b2c0fd6cd30b",
              "idempotency-kit": "80e78a4d9b73aeabb200578c2ecb5090f31a410f",
              "taskgraph": "937abf0d096cb1f6ff48aa09b8dd8a69d9a36c0d",
              "timeout-toolkit": "a2a053e39a6eaa40cde7d81f87ee4838cf562583",
              "automation-control-plane": "42920b932e1eeb9acf143907a7283453cf03eb81",
          }

          receipts = {
              "inventory": "f61c6ce76cedd5e5bc5e7ad2f330fb4dc4c5ba93a41f0924c466af2ff98ef62f",
              "routing": "168e2b01851423293eded1c03d6c1ae5be33ab70c3767ea4b240726760202cde",
              "contextBudget": "237ec6fef34a9e004a13053cafcdc3ef028653ea14ab06f2cc31bd8fc15c0a1f",
              "quotaSimulation": "cfcbd32b8f00a29499189f211a3938bf1202419a60246b20c825503b102cca82",
              "sessionRecord": "241bdca092425972d12afc1b067fa7a426d71a31a2af989aeafa84b9fa8fbf72",
              "circuitSimulation": "f5baa32c762771188aa8d23eee2431662897cb7c9802f035c91e1ce984f32a35",
              "inboxProjection": "94e0d0e52a6a7e5b861b8377234e08ad441136131ed27ebf803585e0e1094d36",
          }

          targets_path = root / "portfolio" / "targets.json"
          targets = json.loads(targets_path.read_text(encoding="utf-8"))
          targets["generatedAt"] = observed_at
          target = next(item for item in targets["targets"] if item["id"] == "agentops")
          target["status"] = "REHEARSAL"
          target["evidence"] = {
              "status": "VERIFIED",
              "source": "automation-control-plane-pr-4-ci-run-32091685544",
              "observedAt": observed_at,
              "expiresAt": expires_at,
          }
          target["risk"] = (
              "The bounded contract rehearsal is current and CI-verified, but human product approval, "
              "source-history import, legacy compatibility, consumers, release, redirects, rollback, "
              "and source archive remain separately blocked."
          )
          target["decision"]["status"] = "PREPARED"
          target["decision"]["rationale"] = (
              "Automation Control Plane remains the prepared durable base. Draft PR 4 proves bounded "
              "AgentOps contracts and negative tests without importing source history or weakening the "
              "existing approvals, budgets, leases, kill switches, recovery, and audit boundaries."
          )
          target["implementationRef"] = {
              "kind": "DRAFT_PR",
              "repository": "automation-control-plane",
              "ref": f"pull/4@{head_sha}",
          }
          for source in target["sources"]:
              source["sourceSha"] = source_shas[source["repository"]]
              source["treeSha"] = None
              source["targetPath"] = None
              source["importCommit"] = None
              source["state"] = "ACTIVE_TARGET" if source["role"] == "TARGET" else "ACTIVE_SOURCE"
          target["gates"] = {
              "decision": "BLOCKED",
              "import": "NOT_RUN",
              "compatibility": "BLOCKED",
              "release": "BLOCKED",
              "consumers": "NOT_RUN",
              "redirect": "BLOCKED",
              "rollback": "NOT_RUN",
              "humanApproval": "BLOCKED",
          }
          targets_path.write_text(json.dumps(targets, indent=2) + "\n", encoding="utf-8")

          decision_path = root / "portfolio" / "agentops-decision.json"
          decision = json.loads(decision_path.read_text(encoding="utf-8"))
          decision["schemaVersion"] = 2
          decision["status"] = "PREPARED"
          decision["selectedBaseEvidence"] = {
              "observedAt": observed_at,
              "expiresAt": expires_at,
              "properties": [
                  "durable SQLite state",
                  "strict versioned workflow schema",
                  "idempotent submission",
                  "bounded retries and deadlines",
                  "digest-bound approvals",
                  "atomic worker leases",
                  "budgets and kill switches",
                  "recovery and audit verification",
                  "machine-readable CLI",
                  "loopback-only read-only dashboard",
                  "102 passing unit and adversarial tests per supported Python job",
                  "clean-environment sdist and wheel parity on Ubuntu 24.04",
              ],
          }
          decision["implementationRef"] = {
              "kind": "DRAFT_PR",
              "repository": "automation-control-plane",
              "pullRequest": 4,
              "headSha": head_sha,
              "ciRun": ci_run,
              "ciStatus": "PASS",
              "observedAt": observed_at,
              "expiresAt": expires_at,
          }
          decision["receipts"] = receipts
          decision["nonGoals"] = [
              "No new repository during the active freeze.",
              "No arbitrary shell, subprocess, network, dynamic import, or executable workflow handler.",
              "A passing contract rehearsal never means that source history was imported.",
              "No legacy package, import, or CLI alias is claimed before compatibility fixtures pass.",
              "No archive before release, consumers, redirect, rollback, and named human approval gates pass.",
          ]
          decision["gates"] = {
              "humanDecision": "BLOCKED",
              "sourceShaInventory": "PASS",
              "collisionReport": "PASS",
              "compatibilityContract": "PASS",
              "contractRehearsal": "PASS",
              "sourceHistoryImport": "NOT_RUN",
              "consumerInventory": "NOT_RUN",
              "release": "BLOCKED",
              "redirect": "BLOCKED",
              "rollback": "NOT_RUN",
              "archive": "BLOCKED",
          }
          decision_path.write_text(json.dumps(decision, indent=2) + "\n", encoding="utf-8")

          actions_path = root / "portfolio" / "actions.json"
          actions = json.loads(actions_path.read_text(encoding="utf-8"))
          actions["generatedAt"] = observed_at
          action = next(item for item in actions["actions"] if item["id"] == "P0-004")
          action["status"] = "IN_PROGRESS"
          action["verification"] = (
              "Review draft PR 4, head cc89dce628202c0ec590567fc7f41ad9637a8012, "
              "CI run 32091685544, source SHA inventory, collision report, compatibility contract, "
              "installed artifact parity, and 102-test counter-proof suite."
          )
          action["closureEvidence"] = [
              pr_url,
              head_sha,
              ci_url,
              "automation-control-plane/docs/AGENTOPS_REHEARSAL.md",
              "automation-control-plane/docs/AGENTOPS_ASSEMBLY_EVIDENCE.md",
          ]
          actions_path.write_text(json.dumps(actions, indent=2) + "\n", encoding="utf-8")

          markdown = dedent(f"""\
          # AgentOps prepared base decision

          ## Decision and current state

          Use `automation-control-plane` as the **prepared base** for the AgentOps target. Do not create another repository during the active freeze.

          Current evidence is bound to draft [automation-control-plane PR #4]({pr_url}), head `{head_sha}`, and successful GitHub Actions run `{ci_run}`. The target is now in `REHEARSAL`; the decision remains `PREPARED`.

          This does **not** claim `MERGED`, `TAGGED`, `RELEASED`, post-release `VERIFIED`, `REDIRECTED`, or `ARCHIVED`.

          ## What the rehearsal proves

          On the explicit Ubuntu 24.04 runner, both Python 3.11 and 3.12 jobs passed:

          - sdist and wheel builds with an exact reviewed CI toolchain;
          - separate clean-environment installations and `pip check`;
          - durable CLI and AgentOps sdist/wheel parity;
          - 102 unit and adversarial tests per job;
          - bytecode, public-boundary, repository, module, and installed-CLI checks;
          - bounded routing, context, quota, session, circuit, inventory, and read-only inbox receipts.

          The one-time assembly verified the archive digest, exact membership, every file digest and byte count, regular-file type, and path containment before the resulting tree was committed. Temporary bootstrap material was removed.

          ## Why this base

          The selected repository already exposes durable SQLite state, strict workflow schemas, idempotent submissions, bounded retries and deadlines, digest-bound approvals, atomic leases, budgets, kill switches, recovery, a tamper-evident audit chain, machine-readable CLI behavior, a loopback-only read-only surface, and broad negative/concurrency tests.

          `agentmesh` remains valuable as the bounded `routing_evidence` contract. The rehearsal imports no source history and does not create a second durable queue or execution engine.

          ## Module boundaries

          | Source | Target module | Current disposition |
          | --- | --- | --- |
          | `automation-control-plane` | `core` | selected durable base |
          | `agentmesh` | `routing_evidence` | bounded contract rehearsal |
          | `agent-budgeter` | `budgets` | deduplicated into durable core |
          | `agent-inbox` | `operator_inbox` | read-only projection rehearsal |
          | `agent-quota-simulator` | `quota_simulation` | bounded test-lab rehearsal |
          | `agent-retry-kit` | `retry_policy` | deduplicated into durable core |
          | `agent-session-recorder` | `session_evidence` | redaction-aware contract rehearsal |
          | `circuit-breaker-lab` | `circuit_breakers` | bounded test-lab rehearsal |
          | `context-window-budgeter` | `context_budgets` | bounded contract rehearsal |
          | `human-in-the-loop-queue` | `approvals_queue` | deduplicated into durable core |
          | `idempotency-kit` | `idempotency` | deduplicated into durable core |
          | `taskgraph` | `task_graph` | deduplicated into durable core |
          | `timeout-toolkit` | `timeouts` | deduplicated into durable core |

          ## Gate status

          | Gate | State | Meaning |
          | --- | --- | --- |
          | source SHA inventory | `PASS` | Exact dated main SHAs are recorded for all thirteen sources. |
          | collision report | `PASS` | Duplicate durable responsibilities and bounded module seams are documented. |
          | compatibility contract | `PASS` | New `agentops` interface and deliberate non-aliases are documented. |
          | contract rehearsal | `PASS` | Current head and installed artifacts passed the bounded counter-proofs. |
          | human product decision | `BLOCKED` | No named human has approved the final irreversible product boundary. |
          | source-history import | `NOT_RUN` | No Git history or source implementation is represented as imported. |
          | consumer inventory | `NOT_RUN` | Imports, packages, workflows, links, docs, and dependants remain to inventory. |
          | release | `BLOCKED` | No stable tag, GitHub Release, SBOM, provenance, or post-publication proof exists. |
          | redirect | `BLOCKED` | Legacy repositories remain active and supported. |
          | rollback | `NOT_RUN` | No migration rollback has been rehearsed. |
          | archive | `BLOCKED` | No source may be archived. |

          ## Non-negotiable invariants

          - no arbitrary shell, subprocess, network, dynamic import, or executable workflow handler;
          - one durable owner for approvals, budgets, retries, task graphs, idempotency, deadlines, leases, kill switches, and audit;
          - exact source SHA evidence expires and must be refreshed;
          - compatibility tests precede every legacy alias or deprecation;
          - contract rehearsal and source-history import remain separate facts;
          - no archive before release, consumers, redirect, rollback, and named human approval all pass.
          """)
          (root / "portfolio" / "AGENTOPS_DECISION.md").write_text(markdown, encoding="utf-8")

          validator_path = root / "scripts" / "check-portfolio.mjs"
          validator = validator_path.read_text(encoding="utf-8")
          start = validator.index("function validateAgentOpsDocument")
          end = validator.index("function validateSchemaDocuments", start)
          replacement = dedent(r"""
          function validateAgentOpsDocument(findings, agentops, targetsDocument, now) {
            const path = REQUIRED_FILES.agentops;
            if (!requireRecord(findings, agentops, path)) return;
            requireExactKeys(findings, agentops, [
              "schemaVersion",
              "target",
              "status",
              "selectedBase",
              "selectedBaseEvidence",
              "implementationRef",
              "moduleMapping",
              "receipts",
              "nonGoals",
              "gates",
            ], path);
            if (agentops.schemaVersion !== 2) push(findings, "schema-version", `${path}.schemaVersion`, "Expected schemaVersion=2.");
            if (agentops.target !== "agentops") push(findings, "agentops-target", `${path}.target`, "Expected target=agentops.");
            requireEnum(findings, agentops.status, ["PREPARED", "APPROVED", "REJECTED", "BLOCKED"], `${path}.status`);
            validateRepositoryName(findings, agentops.selectedBase, `${path}.selectedBase`);

            const target = asArray(targetsDocument?.targets).find((candidate) => candidate?.id === "agentops");
            if (!target) {
              push(findings, "agentops-registry", path, "targets.json does not contain the canonical agentops target.");
              return;
            }
            if (agentops.selectedBase !== target.canonicalRepository || agentops.selectedBase !== target.decision?.selectedBase) {
              push(findings, "agentops-base-drift", `${path}.selectedBase`, "AgentOps selected base must match canonicalRepository and decision.selectedBase in targets.json.");
            }
            const targetSources = new Set(asArray(target.sources).map((source) => source?.repository).filter(Boolean));
            if (!targetSources.has(agentops.selectedBase)) {
              push(findings, "agentops-new-repository", `${path}.selectedBase`, "AgentOps base must be one of the existing source repositories during the freeze.");
            }

            if (requireRecord(findings, agentops.selectedBaseEvidence, `${path}.selectedBaseEvidence`)) {
              requireExactKeys(findings, agentops.selectedBaseEvidence, ["observedAt", "expiresAt", "properties"], `${path}.selectedBaseEvidence`);
              const observedAt = requireDate(findings, agentops.selectedBaseEvidence.observedAt, `${path}.selectedBaseEvidence.observedAt`);
              const expiresAt = requireDate(findings, agentops.selectedBaseEvidence.expiresAt, `${path}.selectedBaseEvidence.expiresAt`);
              if (observedAt && expiresAt && observedAt >= expiresAt) push(findings, "agentops-evidence-window", `${path}.selectedBaseEvidence`, "Evidence expiry must be later than observation.");
              if (expiresAt && expiresAt <= now) push(findings, "stale-agentops-evidence", `${path}.selectedBaseEvidence`, "AgentOps base evidence has expired.");
              if (requireArray(findings, agentops.selectedBaseEvidence.properties, `${path}.selectedBaseEvidence.properties`)) {
                if (agentops.selectedBaseEvidence.properties.length < 5) push(findings, "agentops-evidence-depth", `${path}.selectedBaseEvidence.properties`, "Base decision requires multiple explicit observed properties.");
                for (const [index, property] of agentops.selectedBaseEvidence.properties.entries()) requireString(findings, property, `${path}.selectedBaseEvidence.properties[${index}]`);
              }
            }

            if (requireRecord(findings, agentops.implementationRef, `${path}.implementationRef`)) {
              const referencePath = `${path}.implementationRef`;
              requireExactKeys(findings, agentops.implementationRef, ["kind", "repository", "pullRequest", "headSha", "ciRun", "ciStatus", "observedAt", "expiresAt"], referencePath);
              requireEnum(findings, agentops.implementationRef.kind, ["DRAFT_PR"], `${referencePath}.kind`);
              validateRepositoryName(findings, agentops.implementationRef.repository, `${referencePath}.repository`);
              requireInteger(findings, agentops.implementationRef.pullRequest, `${referencePath}.pullRequest`, 1);
              validateSha(findings, agentops.implementationRef.headSha, `${referencePath}.headSha`, { nullable: false });
              requireInteger(findings, agentops.implementationRef.ciRun, `${referencePath}.ciRun`, 1);
              requireEnum(findings, agentops.implementationRef.ciStatus, ["PASS", "BLOCKED", "NOT_RUN"], `${referencePath}.ciStatus`);
              const observedAt = requireDate(findings, agentops.implementationRef.observedAt, `${referencePath}.observedAt`);
              const expiresAt = requireDate(findings, agentops.implementationRef.expiresAt, `${referencePath}.expiresAt`);
              if (observedAt && expiresAt && observedAt >= expiresAt) push(findings, "agentops-implementation-window", referencePath, "Implementation evidence expiry must be later than observation.");
              if (expiresAt && expiresAt <= now) push(findings, "stale-agentops-implementation", referencePath, "AgentOps implementation evidence has expired.");
              if (agentops.implementationRef.repository !== target.implementationRef?.repository) {
                push(findings, "agentops-implementation-drift", `${referencePath}.repository`, "Decision and target implementation repositories differ.");
              }
              if (!String(target.implementationRef?.ref ?? "").includes(String(agentops.implementationRef.headSha ?? ""))) {
                push(findings, "agentops-implementation-drift", `${referencePath}.headSha`, "Target implementationRef is not bound to the recorded AgentOps head.");
              }
            }

            const mappedRepositories = [];
            const modules = [];
            let selectedBaseCount = 0;
            if (requireArray(findings, agentops.moduleMapping, `${path}.moduleMapping`)) {
              for (const [index, mapping] of agentops.moduleMapping.entries()) {
                const mappingPath = `${path}.moduleMapping[${index}]`;
                if (!requireRecord(findings, mapping, mappingPath)) continue;
                requireExactKeys(findings, mapping, ["repository", "module", "disposition"], mappingPath);
                validateRepositoryName(findings, mapping.repository, `${mappingPath}.repository`);
                requireString(findings, mapping.module, `${mappingPath}.module`, { pattern: /^[a-z][a-z0-9_]*$/ });
                requireEnum(findings, mapping.disposition, ["SELECTED_BASE", "COMPARE_AND_DEDUPLICATE", "IMPORT_AFTER_CONTRACT_TESTS", "IMPORT_AFTER_SCHEMA_REVIEW", "IMPORT_AFTER_REDACTION_REVIEW", "IMPORT_AS_TEST_LAB"], `${mappingPath}.disposition`);
                mappedRepositories.push(mapping.repository);
                modules.push(mapping.module);
                if (mapping.disposition === "SELECTED_BASE") {
                  selectedBaseCount += 1;
                  if (mapping.repository !== agentops.selectedBase) push(findings, "agentops-selected-base-map", mappingPath, "SELECTED_BASE mapping must point to selectedBase.");
                }
              }
            }
            for (const duplicate of duplicates(mappedRepositories)) push(findings, "duplicate-agentops-repository", `${path}.moduleMapping`, `Repository ${duplicate} is mapped more than once.`);
            for (const duplicate of duplicates(modules)) push(findings, "duplicate-agentops-module", `${path}.moduleMapping`, `Module ${duplicate} is mapped more than once.`);
            if (!sameSet(mappedRepositories, [...targetSources]) || mappedRepositories.length !== targetSources.size) {
              push(findings, "agentops-membership-drift", `${path}.moduleMapping`, "AgentOps module mapping must cover exactly the thirteen registered source repositories.");
            }
            if (selectedBaseCount !== 1) push(findings, "agentops-selected-base-count", `${path}.moduleMapping`, "Exactly one module must be SELECTED_BASE.");

            const receiptKeys = ["inventory", "routing", "contextBudget", "quotaSimulation", "sessionRecord", "circuitSimulation", "inboxProjection"];
            if (requireRecord(findings, agentops.receipts, `${path}.receipts`)) {
              requireExactKeys(findings, agentops.receipts, receiptKeys, `${path}.receipts`);
              for (const key of receiptKeys) validateDigest(findings, agentops.receipts[key], `${path}.receipts.${key}`, { nullable: false });
            }

            if (requireArray(findings, agentops.nonGoals, `${path}.nonGoals`)) {
              if (agentops.nonGoals.length < 3) push(findings, "agentops-non-goals", `${path}.nonGoals`, "AgentOps decision requires explicit safety non-goals.");
              for (const [index, nonGoal] of agentops.nonGoals.entries()) requireString(findings, nonGoal, `${path}.nonGoals[${index}]`, { minLength: 10 });
            }

            if (requireRecord(findings, agentops.gates, `${path}.gates`)) {
              const gateKeys = [
                "humanDecision",
                "sourceShaInventory",
                "collisionReport",
                "compatibilityContract",
                "contractRehearsal",
                "sourceHistoryImport",
                "consumerInventory",
                "release",
                "redirect",
                "rollback",
                "archive",
              ];
              requireExactKeys(findings, agentops.gates, gateKeys, `${path}.gates`);
              for (const gate of gateKeys) requireEnum(findings, agentops.gates[gate], ["PASS", "BLOCKED", "NOT_RUN"], `${path}.gates.${gate}`);
              if (agentops.status === "APPROVED" && agentops.gates.humanDecision !== "PASS") {
                push(findings, "agentops-human-decision", path, "APPROVED AgentOps decision requires humanDecision=PASS.");
              }
              if (agentops.gates.contractRehearsal === "PASS") {
                for (const prerequisite of ["sourceShaInventory", "collisionReport", "compatibilityContract"]) {
                  if (agentops.gates[prerequisite] !== "PASS") {
                    push(findings, "agentops-rehearsal-prerequisite", `${path}.gates.contractRehearsal`, `contractRehearsal=PASS requires ${prerequisite}=PASS.`);
                  }
                }
                if (agentops.implementationRef?.ciStatus !== "PASS") {
                  push(findings, "agentops-rehearsal-ci", `${path}.gates.contractRehearsal`, "contractRehearsal=PASS requires current passing CI evidence.");
                }
              }
              if (agentops.gates.sourceHistoryImport === "PASS" && target.gates?.import !== "PASS") {
                push(findings, "agentops-import-drift", `${path}.gates.sourceHistoryImport`, "Source-history import cannot pass while the canonical target import gate is not PASS.");
              }
              if (agentops.gates.consumerInventory === "PASS" && target.gates?.consumers !== "PASS") {
                push(findings, "agentops-consumer-drift", `${path}.gates.consumerInventory`, "Consumer inventory cannot pass while the canonical target consumer gate is not PASS.");
              }
              if (agentops.gates.release === "PASS" && (target.gates?.release !== "PASS" || target.release?.status === "NOT_RELEASED")) {
                push(findings, "agentops-release-drift", `${path}.gates.release`, "Release cannot pass without a canonical target release and release gate.");
              }
              if (agentops.gates.redirect === "PASS" && target.gates?.redirect !== "PASS") {
                push(findings, "agentops-redirect-drift", `${path}.gates.redirect`, "Redirect cannot pass while the canonical target redirect gate is not PASS.");
              }
              if (agentops.gates.rollback === "PASS" && target.gates?.rollback !== "PASS") {
                push(findings, "agentops-rollback-drift", `${path}.gates.rollback`, "Rollback cannot pass while the canonical target rollback gate is not PASS.");
              }
              if (agentops.gates.archive === "PASS") {
                for (const prerequisite of ["humanDecision", "sourceHistoryImport", "consumerInventory", "release", "redirect", "rollback"]) {
                  if (agentops.gates[prerequisite] !== "PASS") {
                    push(findings, "agentops-archive-gate", `${path}.gates.archive`, `archive=PASS requires ${prerequisite}=PASS.`);
                  }
                }
                if (target.status !== "VERIFIED") {
                  push(findings, "agentops-archive-state", `${path}.gates.archive`, "archive=PASS requires the canonical target to be VERIFIED.");
                }
              }
            }
          }

          """).lstrip()
          validator_path.write_text(validator[:start] + replacement + validator[end:], encoding="utf-8")

          test_path = root / "test" / "check-portfolio.test.mjs"
          tests = test_path.read_text(encoding="utf-8")
          marker = 'test("AgentOps contract rehearsal cannot masquerade as source-history import"'
          if marker not in tests:
              tests += dedent(r"""

              test("AgentOps contract rehearsal cannot masquerade as source-history import", async () => {
                const root = await createPortfolioFixture();
                const decision = await readJson(root, "portfolio/agentops-decision.json");
                decision.gates.sourceHistoryImport = "PASS";
                await writeJson(root, "portfolio/agentops-decision.json", decision);
                const report = await checkPortfolio(root, { now: FIXED_NOW });
                assert.equal(report.status, "FAIL");
                assert.equal(hasRule(report, "agentops-import-drift"), true);
              });

              test("AgentOps receipt digests fail closed", async () => {
                const root = await createPortfolioFixture();
                const decision = await readJson(root, "portfolio/agentops-decision.json");
                decision.receipts.inventory = "not-a-digest";
                await writeJson(root, "portfolio/agentops-decision.json", decision);
                const report = await checkPortfolio(root, { now: FIXED_NOW });
                assert.equal(report.status, "FAIL");
                assert.equal(hasRule(report, "string-pattern"), true);
              });

              test("AgentOps archived claim requires every irreversible gate", async () => {
                const root = await createPortfolioFixture();
                const decision = await readJson(root, "portfolio/agentops-decision.json");
                decision.gates.archive = "PASS";
                await writeJson(root, "portfolio/agentops-decision.json", decision);
                const report = await checkPortfolio(root, { now: FIXED_NOW });
                assert.equal(report.status, "FAIL");
                assert.equal(hasRule(report, "agentops-archive-gate"), true);
                assert.equal(hasRule(report, "agentops-archive-state"), true);
              });
              """)
          test_path.write_text(tests, encoding="utf-8")

          workflow_path = root / ".github" / "workflows" / "update-agentops-evidence.yml"
          workflow_path.unlink()
          PY
