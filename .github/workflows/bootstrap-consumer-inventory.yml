name: Temporary consumer inventory assembly

permissions:
  contents: write

on:
  push:
    branches:
      - audit/portfolio-governance-v1-20260818
  pull_request:
    branches:
      - main

concurrency:
  group: consumer-inventory-assembly
  cancel-in-progress: false

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: audit/portfolio-governance-v1-20260818
      - name: Assemble integrity-bound consumer inventory implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          from base64 import b64decode
          from hashlib import sha256
          from io import BytesIO
          import json
          from pathlib import Path, PurePosixPath
          import shutil
          import tarfile

          root = Path.cwd().resolve()
          bootstrap = root / ".bootstrap-consumers"
          manifest = json.loads((bootstrap / "manifest.json").read_text(encoding="utf-8"))
          encoded = (bootstrap / "archive.b64").read_text(encoding="ascii").strip()
          try:
              archive = b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit("invalid base64 archive") from exc

          if manifest.get("schemaVersion") != 1:
              raise SystemExit("unsupported bootstrap manifest")
          if len(archive) != manifest.get("archiveBytes"):
              raise SystemExit("archive byte count mismatch")
          if sha256(archive).hexdigest() != manifest.get("archiveSha256"):
              raise SystemExit("archive SHA-256 mismatch")

          expected = {entry["path"]: entry for entry in manifest.get("files", [])}
          if not expected or len(expected) != len(manifest.get("files", [])):
              raise SystemExit("invalid or duplicate manifest paths")

          observed = {}
          with tarfile.open(fileobj=BytesIO(archive), mode="r:gz") as package:
              for member in package.getmembers():
                  normalized = member.name.removeprefix("./")
                  if member.isdir():
                      continue
                  relative = PurePosixPath(normalized)
                  if (
                      not member.isfile()
                      or not normalized
                      or relative.is_absolute()
                      or ".." in relative.parts
                  ):
                      raise SystemExit(f"unsafe archive member: {member.name}")
                  if normalized not in expected:
                      raise SystemExit(f"unexpected archive member: {normalized}")
                  extracted = package.extractfile(member)
                  if extracted is None:
                      raise SystemExit(f"missing archive data: {normalized}")
                  data = extracted.read()
                  metadata = expected[normalized]
                  if len(data) != metadata["bytes"]:
                      raise SystemExit(f"file byte count mismatch: {normalized}")
                  if sha256(data).hexdigest() != metadata["sha256"]:
                      raise SystemExit(f"file SHA-256 mismatch: {normalized}")
                  destination = root.joinpath(*relative.parts).resolve()
                  if root not in destination.parents:
                      raise SystemExit(f"path escapes repository: {normalized}")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(data)
                  observed[normalized] = sha256(data).hexdigest()

          if set(observed) != set(expected):
              missing = sorted(set(expected) - set(observed))
              raise SystemExit(f"archive membership mismatch; missing={missing}")

          shutil.rmtree(bootstrap)
          (root / ".github" / "workflows" / "bootstrap-consumer-inventory.yml").unlink()
          PY
      - name: Run scanner and portfolio counter-proofs
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/consumer-inventory.mjs
          node --test test/consumer-inventory.test.mjs
          node --test test/*.test.mjs
          node scripts/check-portfolio.mjs --root .
          node scripts/check-governance.mjs --root .
      - name: Commit the reviewed consumer inventory tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: add fail-closed public consumer inventory"
          git push origin "HEAD:audit/portfolio-governance-v1-20260818"
