name: Node evidence baseline

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Unit and negative tests
        run: npm test
      - name: Build when the package declares a build contract
        run: npm run build --if-present
      - name: Pack and install the produced package in a clean project
        shell: bash
        run: |
          set -euo pipefail
          package_file="$(npm pack --ignore-scripts --silent | tail -n 1)"
          test -n "$package_file"
          mkdir -p "$RUNNER_TEMP/npm-artifact"
          cd "$RUNNER_TEMP/npm-artifact"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE/$package_file"
          npm ls --all
